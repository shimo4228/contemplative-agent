# Runs the repo's single gate entrypoint (.claude/verify.sh) with no args on every push to
# main and to claude/** (Claude Code cloud build branches — the judge reads this result
# instead of re-running verify locally; harness ADR-0075). The checks live in verify.sh
# only: ruff format/check, pyright, lint-imports, bandit, shellcheck,
# markdownlint-cli2, pip-audit, pytest, and the advisory eval-baseline staleness check.
# The verify job runs on two cells, ubuntu and macOS: the shell scripts target the BSD
# userland, so their tests run only on macOS (the expected skips per platform are the table
# in tests/_expected_skips.py; any other skip fails the run). This workflow only provides the
# tools verify.sh resolves (.claude/verify.md is the selection record) and calls it. Tests
# that need a live Ollama / claude CLI skip themselves (tests/conftest.py forces
# MOLTBOOK_HOME to a tempdir and OLLAMA_BASE_URL to an unreachable port). A separate job
# scans the whole history for secrets.
# The `packaging` job asks what an installer gets (P0-06.3): an editable install from a
# clean venv, the sdist's scope, both README install routes, and the declared floor.
name: verify

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # shellcheck comes from the dev group (pyproject.toml) and markdownlint-cli2 from
      # package.json: one pin each, shared with the local gate (.claude/verify.sh).
      - name: Install markdownlint-cli2 (package-lock.json)
        run: npm ci --ignore-scripts
      - name: Sync the project venv (dev group, as verify.sh expects)
        run: uv sync
      - name: Verify
        run: ./.claude/verify.sh

  # P0-06.3. Two legs of one job: "current" proves the Quick Start works on a clean
  # venv (the README install routes, --help / init outside a checkout, an sdist
  # without caches, a wheel that builds); "floor" runs the suite on the oldest
  # Python and the oldest direct dependencies the project declares. verify.sh is not
  # called here on purpose: it would pull lint / type tools down to the floor too.
  # The floor is Python 3.11 (D-P0-06-1 = A, owner, 2026-10-24): the matrix pins it
  # and pyproject's requires-python says the same; change both together.
  # Two tests need rsync (not on a bare runner); they skip themselves without it.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: current
            python: "3.13"
          - leg: floor
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Current leg - install, build, README routes
        if: matrix.leg == 'current'
        env:
          CONTEMPLATIVE_PACKAGING: "1"
        run: |
          uv sync
          uv run pytest tests/test_packaging_smoke.py tests/test_provenance.py -q
      - name: Floor leg - oldest direct dependencies, full suite
        if: matrix.leg == 'floor'
        env:
          UV_PYTHON: ${{ matrix.python }}
        # --no-sync: a plain `uv run` would re-resolve at the highest versions
        # and the suite would no longer run on the floor.
        run: |
          uv sync --resolution lowest-direct
          uv run --no-sync python -c "import sys, numpy, requests; print(sys.version.split()[0], 'numpy', numpy.__version__, 'requests', requests.__version__)"
          uv run --no-sync pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
