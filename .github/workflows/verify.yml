# Runs the repo's single gate entrypoint (.claude/verify.sh) with no args on every push to
# main and to claude/** (Claude Code cloud build branches — the judge reads this result
# instead of re-running verify locally; harness ADR-0075). The checks live in verify.sh
# only: ruff format/check, pyright (with the eval group), lint-imports, bandit, shellcheck,
# markdownlint-cli2, pip-audit, pytest, and the advisory eval-baseline staleness check.
# This workflow only provides the tools verify.sh resolves from PATH (.claude/verify.md is
# the selection record) and calls it. Tests that need macOS or a live Ollama / claude CLI
# skip themselves (tests/conftest.py forces MOLTBOOK_HOME to a tempdir and OLLAMA_BASE_URL
# to an unreachable port). A separate job scans the whole history for secrets.
name: verify

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install tools
        run: |
          pip install shellcheck-py==0.11.0.1
          npm i -g markdownlint-cli2@0.23.2
          shellcheck --version
          markdownlint-cli2 --version
      - name: Sync the project venv (dev + eval groups, as verify.sh expects)
        run: uv sync --group eval
      - name: Verify
        run: ./.claude/verify.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
